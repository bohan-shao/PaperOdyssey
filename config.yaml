# ============================================================
# PaperOdyssey global config (single source of truth; business code must not hardcode paths/params/model names)
# Loaded by: config.py (get_config())
# Ablation experiments = change only the corresponding switch here (see README: Ablation discipline)
# ============================================================

seed: 42

# ---- Paths (relative to the project root) ----
paths:
  raw: data/raw
  processed: data/processed
  indices: data/indices
  eval: data/eval
  results: data/results

# ---- kb/ knowledge base ----
kb:
  filter:
    categories: [cs.CL, cs.AI, cs.LG]
    year_min: 2015
    year_max: 2025
    citation_min: 0            # OpenAlex citation-count lower bound (raise for quality, lower for quantity)
    target_papers: 20000       # target paper count (15k-30k)
  fetch:
    per_slice: 150             # max arXiv records per (category, year, month) slice -> candidate pool
    page_size: 100             # records per arXiv API request
    request_interval_s: 3.0    # arXiv API: >= 3 s between requests
    openalex_batch: 50         # arXiv ids per OpenAlex request
    openalex_api_key: ${OPENALEX_API_KEY}   # optional; anonymous use is capped at ~1000 calls/day
    contact_email: ${KB_CONTACT_EMAIL}      # optional; User-Agent / OpenAlex polite pool
    citation_default: 0        # citation count for papers OpenAlex does not know
  download:
    max_concurrency: 1         # arXiv terms: a single connection at a time
    request_interval_s: 3.0    # arXiv rate limiting (global: one request start per interval)
  parse:
    workers: 4                 # parallel PDF parsing processes
    keep_captions: true        # R7: keep "Figure N:/Table N:" caption text
    min_alpha_ratio: 0.55      # R3: drop lines with fewer letters (formula/table noise)
    min_font_ratio: 0.9        # R3: drop lines smaller than this x body font (footnotes, figure labels)
    heading_size_delta: 0.8    # heading = bold or font >= body + delta (plus numbered/known-word pattern)
    header_footer_min_ratio: 0.3   # R2: margin lines repeated on >= this share of pages (0.3 catches odd/even headers)
    margin_ratio: 0.12         # R2: top/bottom page share treated as header/footer zone
    drop_sections: [acknowledgments, acknowledgements, acknowledgment, acknowledgement, acknowledge,
                    acknowledgments and disclosure of funding, acknowledgements and disclosure of funding,
                    author contributions, funding, ethics statement, ethical statement,
                    ethical considerations, ethical consideration, broader impact, broader impacts,
                    impact statement, reproducibility statement, declarations, conflict of interest,
                    conflicts of interest, competing interests, declaration of competing interest,
                    declaration of interests, data availability, data availability statement,
                    code availability]   # R6: statements, not paper content
    front_matter_max_words: 400   # R5: longer text before the first heading is kept, not dropped
    min_words: 500             # quality check: fewer words -> paper excluded
    max_bad_char_ratio: 0.02   # quality check: broken-glyph share above this -> excluded
    qa_sample: 50              # papers sampled for manual parse-quality review
  chunk:
    mode: section_fixed        # section_fixed | semantic (Q3 ablation)
    chunk_tokens: 350          # body tokens per chunk (prefix not counted)
    overlap_tokens: 100
    min_new_tokens: 50         # a tail chunk adding fewer new tokens is merged into the previous one
    tokenizer: tiktoken        # tiktoken | transformers (measurement convention, note in the report)
    tiktoken_encoding: cl100k_base
    semantic_threshold: 0.55   # cut where adjacent-sentence cosine < this (mode=semantic). Calibrated on
                               # 2.5k sentence pairs with bge-small: median 0.65, 10th pct 0.53
    semantic_model: BAAI/bge-small-en-v1.5  # sentence encoder for semantic chunking
    semantic_min_tokens: 100
    semantic_max_tokens: 500
    prefix: "[{title}] {section}"   # chunk prefix format (embedded as the first line of `text`)
  store:
    passages_file: passages.jsonl
    sections_file: sections.jsonl   # parent-section units (D22 parent-document retrieval)
    sqlite_file: papers.sqlite
  stats:
    out_file: corpus_stats.json

# ---- retrieval/ retrieval core (ablation matrix changes go here) ----
retrieval:
  query_processing:
    enabled: true              # Q3 ablation: normalized semantic query + deduplicated lexical view
    max_terms: 64
    stopwords: [a, an, the, and, or, of, to, in, "on", for, with, by, from, is, are,
                was, were, be, been, being, do, does, did, how, what, which, that,
                this, these, those, can, could, would, should, please, find, papers]
  diversity:
    enabled: true              # Q3 ablation: select across papers/sections before expensive reranking
    candidate_per_paper: 4
    candidate_per_parent: 2
    final_per_paper: 2
    final_per_parent: 1
  lookup:
    db_file: lookup.sqlite      # passage/section records by id (under paths.indices), hydrates BM25/FAISS hits
  sparse:
    enabled: true
    backend: pyserini           # pyserini | sqlite (disk-backed, no Java) | rankbm25 (small samples)
    top_k: 150                  # broaden cheap recall; reranking still has a separate fixed budget
    index_dir: bm25             # relative to paths.indices
    bm25: {k1: 0.9, b: 0.4}     # Pyserini and rank-bm25; SQLite uses its own fixed constants
    field_weighting:
      enabled: false           # Q3 ablation, sqlite only; evaluate before enabling
      weights: [2.0, 0.5, 1.0] # title, section, body; SQLite has fixed k1=1.2 and b=0.75
  dense:
    enabled: true
    model_name: BAAI/bge-large-en-v1.5
    query_format: auto         # auto | bge | qwen3 | plain; never prepend BGE instructions to Qwen/MiniLM
    query_instruction: null    # explicit override for local model paths; null selects query_format
    task_instruction: "Given a scientific question, retrieve relevant passages from research papers"
    max_length: 512            # document token limit in manifest; Qwen3 trial: 1024, batch_size: 8
    device: null               # automatic CUDA/CPU, or an explicit torch device
    batch_size: 64
    fp16: true
    faiss_dir: faiss            # relative to paths.indices
    hnsw: {M: 32, efConstruction: 200, efSearch: 128}
    top_k: 150
    filter_exact_max: 50000     # filtered searches keeping <= this many passages are exact (HNSW misses hits on small selections)
  fusion:
    rrf_k: 60
    weights: [1.0, 1.0]         # [sparse, dense]
    top_k: 50                   # fused candidates kept (the reranker's input)
  rerank:
    enabled: true
    model_name: BAAI/bge-reranker-v2-m3
    device: null               # automatic CUDA/CPU; diagnostic runs explicitly choose CPU
    top_k: 10
    max_length: 512             # (query, passage) tokens per pair; longer pairs are truncated
    batch_size: 64              # retain the reference baseline; tune per hardware with latency benchmark
    fp16: true
  parent_doc:
    enabled: false              # Q3 ablation: parent-document retrieval
    max_chars: 6000              # child-anchored excerpt; 0 restores unbounded legacy sections
  filters:
    enabled: true               # Q3 innovation: metadata filtering
  parallel: true                # run sparse/dense in parallel

# ---- orchestration/ orchestration layer (agentic) ----
orchestration:
  agentic:
    enabled: true               # Q5 baseline (D55): false = plain RAG: the question -> hybrid retrieval + rerank
                                # -> the same answer step; no LLM in search (understanding/HyDE/review/loop off)
  num_sub_queries: 3
  hyde:
    enabled: false              # Q3 innovation: HyDE query expansion (on = one extra LLM call)
  review:
    backend: llm                # llm | jev (Q5 comparison: LLM reviewer vs TypeSafe Jev, llm/jev.py)
    jev:
      pass_threshold: 0.5       # keep a paper when Jev's P(pass) >= this (tune on the dev split)
      covered_threshold: 0.5    # an aspect counts as covered when Jev's P(yes) >= this
    batch_size: 5
    max_concurrency: 2          # concurrent LLM review workers
    max_tokens_per_paper: 1500  # token budget fed to the reviewer per paper (title + abstract + top passages)
    rubric:                     # fixed scoring dimensions (D10)
      - relevance              # relevance to the need
      - coverage               # coverage of the input's aspects
      - recency                # recency
      - credibility            # source credibility
      - technical_depth        # technical depth
  loop:
    enabled: true               # Q5 ablation: false = single-round parallel (agentic baseline)
    max_rounds: 3
    min_papers: 5               # stop when the pass paper count reaches the target
    cache: true                 # cache identical inputs (saved under data/results/final_results/)
    re_review: true             # D53: a later round re-reviews a paper with passages not seen before
  rewrite:
    max_queries_per_round: 2

# ---- downstream/ cited paper question answering ----
downstream:
  max_papers: 5
  passages_per_paper: 2
  max_chars_per_passage: 2400   # source excerpts shown in the UI match this exact model context
  max_tokens: 1024             # answer generation only; search uses llm.max_tokens

# ---- llm (DeepSeek by default, OpenAI-compatible; key in .env) ----
llm:
  model: ${LLM_MODEL}           # default deepseek-chat (overridden by .env)
  base_url: ${LLM_BASE_URL}
  retries: 3
  max_tokens: 1024
  temperature: 0.2
  timeout_s: 60                 # per-request timeout
  jev:                          # TypeSafe Jev: typed decisions only, no text (used when orchestration.review.backend = jev)
    model: jev-latest           # key: TYPESAFE_API_KEY in .env
    base_url: https://api.typesafe.ai
    retries: 3                  # 429 / 529 / 5xx / network errors, exponential backoff
    timeout_s: 30

# ---- eval/ evaluation ----
eval:
  dev_ratio: 0.1                # dev/eval split
  retrieval_probe:              # CPU proxy models for a small, reproducible smoke benchmark
    dense_model: sentence-transformers/all-MiniLM-L6-v2
    dense_max_length: 256
    rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
    rerank_max_length: 512
    batch_size: 16
    cpu_threads: 4
  annotation:                   # eval set (D39, scripts/eval_set.py); files under paths.eval
    drafts_file: drafts.jsonl   # LLM-drafted questions, all rounds
    sheets_dir: annotation      # marking sheets round<R>_part<P>_<annotator>.csv and to_rewrite.csv
    rewrite_file: to_rewrite.csv
    eval_set_file: eval_set.jsonl
    annotators: [A, B, C, D, E] # names in the sheet file names; the same names every time (D39, D42)
  answer:                       # answer-level metrics (D49, scripts/run_eval.py --stage answer)
    judge_model: null           # null: the generator's llm.model (it may favor its own answers; say so in the report)
    judge_temperature: 0.0
    judge_max_tokens: 2048      # first-attempt output limit per judge call (doubled on a cut-off reply)
    relevance_questions: 3      # RAGAS answer relevance: questions written back from each answer
  answer_audit:                 # human answer audit (D54, scripts/answer_audit.py); files under paths.eval
    dir: answer_audit           # sheets, reading packets and the manifest
    split: eval
    per_answer: 2               # annotators per answer (eval.annotation.annotators, pairs cycled as in D42)
    sizes: {perfect: 40, mostly: 30, low: 20, no_answer: 10}   # answers per LLM-judge stratum (100)

# ---- ui/ ----
ui:
  title: "PaperOdyssey — arXiv Paper RAG"
  example_inputs:               # Q2: 5 example inputs
    - "Compare LoRA and full fine-tuning for large language models: methods, trade-offs, and recent variants."
    - "What techniques improve long-context transformer efficiency since 2023?"
    - "Summarize approaches to RAG evaluation, including faithfulness and retrieval metrics."
    - "Which papers propose training-free model merging or ensemble methods?"
    - "Find recent work on mitigating hallucination in LLM generation."
